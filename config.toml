[server]
headless = true
runOnSave = false
# serves ./static at app/static/ - the bundled Inter font lives there, so no external font request is made
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "dark"
primaryColor = "#29D3C2"
backgroundColor = "#0B1424"
secondaryBackgroundColor = "#16243A"
textColor = "#F4F7FC"
linkColor = "#64D6F5"
borderColor = "rgba(160,185,220,0.14)"
font = "Inter, sans-serif"
baseFontSize = 14
baseRadius = "10px"
showWidgetBorder = true
showSidebarBorder = true
greenColor = "#35D6A0"
redColor = "#FF727F"
orangeColor = "#F3B75D"
yellowColor = "#F4BD64"
blueColor = "#638CFF"
violetColor = "#A78BFA"
chartCategoricalColors = ["#29D3C2", "#638CFF", "#A78BFA", "#F4BD64", "#64D6F5", "#35D6A0", "#FF727F", "#8B9BB2"]

# Inter (SIL Open Font License, static/fonts/OFL-LICENSE.txt), variable weight, bundled locally
[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-wght-normal.woff2"
weight = "100 900"
unicodeRange = "U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-ext-wght-normal.woff2"
weight = "100 900"
unicodeRange = "U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF"

[theme.sidebar]
backgroundColor = "#080F1C"
secondaryBackgroundColor = "#101D31"
